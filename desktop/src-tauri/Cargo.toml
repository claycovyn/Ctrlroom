[package]
name = "ctrlroom-desktop"
version = "0.1.1"
description = "Ctrl Room desktop app"
authors = ["OpenCtrl"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 2.12 is the first release with WebviewWindowBuilder::on_permission_request (camera and mic for calls).
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
